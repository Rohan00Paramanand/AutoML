[theme]
primaryColor = "#6366f1"
backgroundColor = "#0a0e1a"
secondaryBackgroundColor = "#131b2e"
textColor = "#f1f5f9"
font = "sans serif"

[client]
showErrorDetails = true

[server]
headless = true
enableCORS = false
enableXsrfProtection = false
allowRunOnSave = true
enableWebsocketCompression = true

[browser]
gatherUsageStats = false
